services:
  - type: web
    name: loopforge-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
